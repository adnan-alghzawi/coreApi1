<p class="page-title">category-details works!</p>

<div *ngIf="category" class="category-details-container">
  <h1 class="category-title">Category ID: {{ category.categoryId }}</h1>
  <h2 class="category-name">Name: {{ category.categoryName }}</h2>
  <p class="category-description">Description: {{ category.categoryDescription }}</p>
</div>
