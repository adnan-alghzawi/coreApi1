<div class="container mt-4">
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let cat of categoryList">
      <div class="card h-100 shadow">
        <div class="card-body">
          <h5 class="card-title">{{ cat.categoryName }}</h5>
          <p class="card-text">{{ cat.categoryDescription }}</p>
        </div>
        <div class="card-footer">
          <small class="text-muted">ID: {{ cat.categoryId }}</small>
        </div>
      </div>
    </div>
  </div>
</div>
