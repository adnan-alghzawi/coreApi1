<p class="text-center fs-4 fw-bold text-success mb-4" style="background-color:black; color:white">
  All Categories
</p>

<div class="container">
  <table class="table table-bordered table-hover text-center align-middle">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>EDIT</th>
        <th>DELETE</th>

      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of container">
        <td>{{ item.categoryId }}</td>
        <td>{{ item.categoryName }}</td>
        <td>{{ item.categoryDescription }}</td>

        <td>
          <a [routerLink]="['/editCategory', item.categoryId]" class="btn btn-warning">Edit</a>
        </td>

        <td>
          <button (click)="deleteCategoryById(item.categoryId)" class="btn btn-danger">Delete</button>
        </td>
      </tr>
    </tbody>

  </table>
</div>
