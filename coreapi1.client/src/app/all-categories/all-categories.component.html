<p class="text-center fs-4 fw-bold text-success mb-4"style="background-color:black; color:white">All Categories</p>

<div class="container">
  <div class="row g-4">
    <div class="col-md-4" *ngFor="let item of container">
      <div class="card h-100 shadow-sm border-0 rounded-4 p-3 category-card">
        <div class="card-body">
          <h5 class="card-title text-primary">#{{ item.categoryId }}</h5>
          <h4 class="fw-bold">{{ item.categoryName }}</h4>
          <p class="text-muted">{{ item.categoryDescription }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
